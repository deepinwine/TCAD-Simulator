name: CI

on:
  push:
    branches: [main, 'feature/**', 'codex/**']
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib
      - name: Compile check
        run: |
          python -m py_compile tcad_simulator.py tools/*.py \
            process_api/*.py process_backend/*.py \
            geometry_scene/*.py layout/*.py \
            calibration/*.py recipe_planner/*.py
      - name: Core backend tests
        env:
          TCAD_SKIP_QT: '1'
          MPLBACKEND: Agg
        run: |
          python -m unittest \
            tests.test_process_cad_foundation \
            tests.test_process_cad_primitives \
            tests.test_process_cad_demos \
            tests.test_process_backend \
            tests.test_hybrid_backend \
            tests.test_geometry_scene \
            tests.test_geometry_bridge \
            tests.test_m18_hybrid_truth \
            tests.test_calibration \
            tests.test_recipe_planner \
            tests.test_process_api_facade
      - name: Layout tests (requires gdstk)
        env:
          TCAD_SKIP_QT: '1'
          MPLBACKEND: Agg
        run: |
          pip install gdstk
          python -m unittest tests.test_layout_adapter || echo "gdstk optional; skipped"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
