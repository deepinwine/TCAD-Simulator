name: CI

on:
  push:
    branches: [main, 'feature/**', 'codex/**']
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib scipy cryptography
      - name: Compile check
        run: |
          python -m py_compile tcad_simulator.py tools/*.py \
            process_api/*.py process_backend/*.py \
            geometry_scene/*.py layout/*.py \
            calibration/*.py recipe_planner/*.py \
            structure_cad/*.py tcad_studio.py
      - name: Core backend tests
        env:
          TCAD_SKIP_QT: '1'
          MPLBACKEND: Agg
        run: |
          python -m unittest \
            tests.test_process_cad_foundation \
            tests.test_process_cad_primitives \
            tests.test_process_cad_demos \
            tests.test_webui_viewer_contract \
            tests.test_webui_cad_shell \
            tests.test_process_backend \
            tests.test_hybrid_backend \
            tests.test_geometry_scene \
            tests.test_geometry_bridge \
            tests.test_m18_hybrid_truth \
            tests.test_backend_reliability \
            tests.test_calibration \
            tests.test_recipe_planner \
            tests.test_recipe_reliability \
            tests.test_process_api_facade \
            tests.test_m34_demos \
            tests.test_dram_reliability \
            tests.test_ci_contract \
            tests.test_structure_cad \
            tests.test_structure_cad_http \
            tests.test_structure_display_geometry \
            tests.test_structure_display_provenance \
            tests.test_structure_display_http \
            tests.test_structure_editor_http \
            tests.test_tcad_studio_launcher
      - name: Layout tests (optional gdstk)
        env:
          TCAD_SKIP_QT: '1'
          MPLBACKEND: Agg
        run: |
          # BLOCK-005: optional deps must not break CI if unavailable,
          # but test failures must always propagate.
          if pip install gdstk 2>/dev/null; then
            echo "gdstk installed — running full layout tests"
            python -m unittest tests.test_layout_adapter
          else
            echo "::warning::gdstk not installable — running layout tests (will skip)"
            python -m unittest tests.test_layout_adapter || {
              exit_code=$?
              if [ $exit_code -ne 0 ]; then
                echo "::error::layout tests failed (not a skip)"
                exit $exit_code
              fi
            }
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
